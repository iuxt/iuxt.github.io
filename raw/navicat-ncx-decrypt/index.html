<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light" />
		<meta
			name="description"
			content="在浏览器本地解析 Navicat 12–16 导出的 NCX 连接文件并解密已保存密码。"
		/>
		<title>Navicat NCX 密码查看器</title>
		<link
			rel="icon"
			href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230f766e'/%3E%3Cpath d='M19 29v-6a13 13 0 0 1 26 0v6M16 29h32v24H16z' fill='none' stroke='white' stroke-width='5' stroke-linejoin='round'/%3E%3Ccircle cx='32' cy='40' r='3' fill='white'/%3E%3C/svg%3E"
		/>
		<link rel="stylesheet" href="css/style.css" />
	</head>
	<body>
		<header class="topbar">
			<a class="brand" href="./" aria-label="返回工具首页">
				<span class="brand-mark" aria-hidden="true">
					<svg viewBox="0 0 24 24">
						<path d="M7 10V7a5 5 0 0 1 10 0v3M5 10h14v11H5z" />
						<path d="M12 14v3" />
					</svg>
				</span>
				<span>Navicat NCX 密码查看器</span>
			</a>
			<span class="offline-badge"><i></i>100% 本地处理</span>
		</header>

		<main>
			<section class="hero" aria-labelledby="page-title">
				<div class="eyebrow">NAVICAT 12–16</div>
				<h1 id="page-title">找回 NCX 文件中保存的连接密码</h1>
				<p>
					文件只在当前浏览器内存中解析，不上传、不缓存，也不需要安装 Python
					或任何依赖。
				</p>
			</section>

			<section class="workspace-card">
				<div class="tabs" role="tablist" aria-label="输入方式">
					<button class="tab active" id="fileTab" role="tab" aria-selected="true" aria-controls="filePanel">选择文件</button>
					<button class="tab" id="pasteTab" role="tab" aria-selected="false" aria-controls="pastePanel">粘贴 XML</button>
				</div>

				<div id="filePanel" class="tab-panel" role="tabpanel" aria-labelledby="fileTab">
					<input id="fileInput" type="file" accept=".ncx,.xml,text/xml,application/xml" hidden />
					<div id="dropZone" class="drop-zone" tabindex="0" role="button" aria-describedby="dropHint">
						<div class="upload-icon" aria-hidden="true">
							<svg viewBox="0 0 24 24"><path d="M12 16V4m0 0L7 9m5-5 5 5M5 15v4h14v-4" /></svg>
						</div>
						<h2>拖入 Navicat 导出的 .ncx 文件</h2>
						<p id="dropHint">或者点击此处选择文件 · 最大 10 MB</p>
						<button class="btn btn-primary" type="button" id="chooseFileBtn">选择 NCX 文件</button>
					</div>
				</div>

				<div id="pastePanel" class="tab-panel hidden" role="tabpanel" aria-labelledby="pasteTab">
					<label class="field-label" for="xmlInput">NCX / XML 内容</label>
					<textarea id="xmlInput" spellcheck="false" placeholder="<?xml version=&quot;1.0&quot; encoding=&quot;UTF-8&quot;?>&#10;<Connections>…</Connections>"></textarea>
					<div class="paste-actions">
						<span>内容不会离开此页面</span>
						<button class="btn btn-primary" type="button" id="parseTextBtn">开始解析</button>
					</div>
				</div>
			</section>

			<div id="message" class="message hidden" role="alert" aria-live="polite"></div>

			<section id="resultsSection" class="results hidden" aria-labelledby="resultsTitle">
				<div class="results-head">
					<div>
						<p class="section-kicker">解析结果</p>
						<h2 id="resultsTitle"><span id="resultCount">0</span> 个数据库连接</h2>
						<p id="sourceName" class="source-name"></p>
					</div>
					<div class="toolbar">
						<label class="search-box">
							<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-4-4" /></svg>
							<input id="searchInput" type="search" placeholder="搜索名称、主机或用户" />
						</label>
						<button class="btn btn-secondary" id="exportBtn" type="button">导出 JSON</button>
						<button class="btn btn-danger" id="clearBtn" type="button">清空</button>
					</div>
				</div>

				<div id="connectionList" class="connection-list"></div>
				<div id="noMatches" class="empty-result hidden">没有匹配的连接</div>
			</section>

			<section class="help-card">
				<div class="help-icon" aria-hidden="true">i</div>
				<div>
					<h2>使用说明</h2>
					<p>
						在 Navicat 中选择“导出连接”，勾选“导出密码”后得到 NCX 文件。此工具按
						Navicat 12 及以上版本的 AES 格式解密；未保存密码的连接会显示“无密码”。
					</p>
				</div>
			</section>
		</main>

		<div id="toast" class="toast" role="status" aria-live="polite"></div>
		<script src="js/aes.js"></script>
		<script src="js/app.js"></script>
	</body>
</html>
